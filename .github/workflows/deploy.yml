# .github/workflows/deploy.yml
# 工作流名称：部署 VitePress 到 GitHub Pages
name: Deploy VitePress to GitHub Pages

# 触发条件：当代码推送到 master 分支时自动运行
on:
  push:
    branches: [master]

# 赋予 GitHub Actions 必要的权限，用于写入 GitHub Pages 和身份验证
permissions:
  contents: read            # 读取仓库代码
  pages: write                # 写入 GitHub Pages
  id-token: write     # 用于身份验证，确保部署安全

# 控制并发部署，避免多个部署同时运行导致冲突
concurrency:
  group: pages        # 使用 pages 作为并发组名
  cancel-in-progress: false  # 不取消正在进行的部署（保持最新部署完成）

jobs:
  # 构建任务：生成静态网站文件
  build:
    runs-on: ubuntu-latest  # 使用最新版 Ubuntu 环境
    steps:
      - name: Checkout        # 步骤1：拉取代码
        uses: actions/checkout@v4

      - name: Setup Node      # 步骤2：安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22    # 使用 Node.js 22 版本（与 VitePress 兼容）
          cache: npm          # 启用 npm 缓存，加速依赖安装

      - name: Install dependencies   # 步骤3：安装项目依赖
        run: npm ci           # 使用 npm ci 进行干净的依赖安装（基于 package-lock.json）

      - name: Build with VitePress   # 步骤4：构建 VitePress 生成静态文件
        run: npm run docs:build

      - name: Upload artifact        # 步骤5：上传构建产物作为 GitHub Pages 部署的 artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist      # 指定 VitePress 构建输出目录

  # 部署任务：将构建好的静态文件发布到 GitHub Pages
  deploy:
    environment:
      name: github-pages             # 环境名称，对应 GitHub Pages 部署环境
      url: ${{ steps.deployment.outputs.page_url }}  # 部署后的访问地址
    runs-on: ubuntu-latest
    needs: build                     # 依赖 build 任务成功
    steps:
      - name: Deploy to GitHub Pages # 步骤：部署
        id: deployment                # 步骤 ID，用于获取输出
        uses: actions/deploy-pages@v4  # 使用官方部署 Action