# 工作流名称：部署 VitePress 到 GitHub Pages
name: Deploy VitePress to GitHub Pages

# 触发条件：当代码推送到 master 分支时自动执行
on:
  push:
    branches:
      - master

# 给 GitHub Actions 开启必要权限（解决 128 错误）
permissions:
  contents: write      # 允许读写仓库文件
  pages: write         # 允许部署 GitHub Pages
  id-token: write      # 身份验证权限

# 执行任务
jobs:
  deploy:              # 任务名称：deploy
    runs-on: ubuntu-latest  # 在最新版 Ubuntu 系统上运行

    steps:
      # 步骤1：拉取代码到 GitHub 服务器
      - name: Checkout 拉取代码
        uses: actions/checkout@v4

      # 步骤2：安装 Node.js 环境
      - name: Setup Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22    # 使用 Node.js 22
          cache: npm          # 开启 npm 缓存，加速构建

      # 步骤3：安装项目依赖
      - name: 安装依赖包
        run: npm install

      # 步骤4：构建 VitePress 生成静态网站
      - name: 构建 VitePress 项目
        run: npm run docs:build

      # 步骤5：将构建好的网站部署到 GitHub Pages
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # GitHub 自动提供的密钥
          publish_dir: .vitepress/dist                # VitePress 构建输出目录